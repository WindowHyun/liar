name: release

# v로 시작하는 태그를 밀면 exe를 만들어 릴리즈에 올린다.
#   git tag v0.8.2 && git push origin v0.8.2
# 수동으로 돌리고 싶으면 Actions 탭에서 "Run workflow"를 누른다.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # 릴리즈를 만들려면 필요하다

jobs:
  windows:
    runs-on: windows-latest   # Windows exe는 Windows에서 만든다

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # 여기서는 Electron 바이너리가 실제로 필요하다(패키징 대상이므로 건너뛰지 않는다).
      - run: npm ci

      - name: exe 빌드 후 릴리즈에 올리기
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # electron-builder는 릴리즈를 만들지만 설명은 비워 둔다. 받는 사람이 가장 먼저
      # 보는 자리라 사용법을 채워 넣는다. 빌드가 실패해도 시도한다.
      - name: 릴리즈 설명 채우기
        if: always()
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          gh release edit "v$VERSION" \
            --title "v$VERSION - 켜면 자동으로 모이는 라이어 게임" \
            --notes-file docs/release-notes.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 릴리즈가 실패해도 결과물은 받아 볼 수 있게 남긴다.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: liar-game-win-x64
          path: dist/*.exe
          if-no-files-found: warn
