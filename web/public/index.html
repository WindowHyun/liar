<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Slack</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- [요청] Electron 전용 커스텀 타이틀바. 웹(브라우저) 빌드에서는 계속 숨겨 둔다
       (OS 창틀 자체가 없으므로 만들 이유도 없다). app.js가 window.liar.isElectron일 때만 보여준다. -->
  <div id="titlebar" class="hidden">
    <div id="titlebar-search"><input id="titlebar-search-input" placeholder="검색" disabled /></div>
    <div id="titlebar-controls">
      <button id="titlebar-min" class="titlebar-btn" title="최소화" aria-label="최소화">
        <svg viewBox="0 0 10 10" aria-hidden="true"><path d="M0 5h10" stroke="currentColor" stroke-width="1"/></svg>
      </button>
      <button id="titlebar-max" class="titlebar-btn" title="최대화" aria-label="최대화">
        <svg viewBox="0 0 10 10" aria-hidden="true"><rect x="0.5" y="0.5" width="9" height="9" fill="none" stroke="currentColor" stroke-width="1"/></svg>
      </button>
      <button id="titlebar-close" class="titlebar-btn titlebar-close" title="닫기" aria-label="닫기">
        <svg viewBox="0 0 10 10" aria-hidden="true"><path d="M0 0l10 10M10 0L0 10" stroke="currentColor" stroke-width="1"/></svg>
      </button>
    </div>
  </div>

  <div id="screen-join">
    <h1 data-label="app">Slack</h1>
    <p>닉네임을 입력하고 접속하세요.</p>
    <input id="nickname-input" placeholder="닉네임" maxlength="24" autocomplete="off" />
    <button id="join-btn">접속</button>
    <p class="hint">같은 주소로 접속한 사람끼리 함께 플레이합니다. 최소 2명, 최대 8명입니다.</p>
  </div>

  <div id="screen-game" class="hidden">
    <div id="sidebar">
      <h2 data-label="app">Slack</h2>
      <p class="sub">워크스페이스</p>
      <p class="label">다이렉트 메시지</p>
      <ul id="participant-list"></ul>
      <div id="sidebar-foot">
        <button id="leave-btn" title="방에서 나갑니다">방 나가기</button>
        <p id="tally-label"></p>
        <p id="conn-hint"></p>
      </div>
    </div>

    <div id="main">
      <div id="banner" class="hidden"></div>

      <div id="topbar">
        <h2 id="channel-name" data-label="channel"># Oliveyoung</h2>
        <div id="topbar-actions">
          <!-- 슬랙처럼 인원수만, 허들(투표) 버튼 왼쪽에 -->
          <span id="member-count" title="참가 인원">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 8a2.6 2.6 0 1 0 0-5.2A2.6 2.6 0 0 0 8 8Zm0 1.2c-2 0-4.5 1-4.5 2.6v1.4h9v-1.4c0-1.6-2.5-2.6-4.5-2.6Z"/></svg>
            <b>0</b>
          </span>
          <button id="vote-btn" title="투표 시작" disabled>
            <span class="em">🎧</span>
          </button>
          <button id="start-btn" title="게임 시작" aria-label="게임 시작">
            <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="6.5" cy="6.5" r="4.5" fill="none" stroke="currentColor" stroke-width="1.5"/><line x1="10" y1="10" x2="14" y2="14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          </button>
        </div>
      </div>

      <div id="role-card" class="hidden"></div>

      <div id="chat">
        <div id="chat-messages"></div>
        <!-- 찬반·투표·정답은 여기에, 대화 흐름 안에 들여쓰여 나온다 -->
        <div id="live-block"></div>
      </div>

      <!-- [2번] 위로 스크롤해 있으면 진행 중이라고 알리는 얇은 띠 -->
      <button id="jump-bar" class="hidden">
        <span class="arrow">▼</span> <span id="jump-text">투표가 진행 중입니다</span>
      </button>

      <div id="composer">
        <div id="composer-box">
          <!-- [요청] 슬랙 실제 입력창처럼 위에 서식 도구줄을 둔다. 이미 지원하는 서식
               (굵게·취소선·코드)만 실제로 눌러서 넣을 수 있고, 나머지는 자리만 있다. -->
          <div id="composer-toolbar">
            <button type="button" class="fmt-btn" data-wrap="**" title="굵게"><b>B</b></button>
            <button type="button" class="fmt-btn" title="기울임" disabled><i>I</i></button>
            <button type="button" class="fmt-btn" title="밑줄" disabled><u>U</u></button>
            <button type="button" class="fmt-btn" data-wrap="~~" title="취소선"><s>S</s></button>
            <span class="toolbar-sep"></span>
            <button type="button" class="fmt-btn" title="링크" disabled>
              <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6.5 9.5a3 3 0 0 0 4.24 0l2-2a3 3 0 0 0-4.24-4.24l-1 1M9.5 6.5a3 3 0 0 0-4.24 0l-2 2a3 3 0 0 0 4.24 4.24l1-1" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>
            </button>
            <button type="button" class="fmt-btn" title="번호 목록" disabled>
              <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6 4h8M6 8h8M6 12h8M2 4h.01M2 8h.01M2 12h.01" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
            </button>
            <button type="button" class="fmt-btn" data-wrap="`" title="코드">
              <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M5 4 1.5 8 5 12M11 4l3.5 4-3.5 4" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
          </div>
          <textarea id="chat-input" placeholder="댓글 남기기..." maxlength="300" rows="1"></textarea>
          <div id="composer-actions">
            <button type="button" class="fmt-btn" title="파일 첨부" disabled>+</button>
            <button type="button" class="fmt-btn" title="글자 크기" disabled>Aa</button>
            <button type="button" class="fmt-btn" title="이모지" disabled>🙂</button>
            <button type="button" class="fmt-btn" id="mention-btn" title="멘션">@</button>
            <span class="composer-actions-fill"></span>
            <button id="send-btn" title="전송" aria-label="전송">
              <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M1.5 18.5 19 10 1.5 1.5 1.5 8.2l12.4 1.8-12.4 1.8z"/></svg>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

<script src="app.js"></script>
</body>
</html>
